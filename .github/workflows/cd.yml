name: CD — Déploiement ProsArtisan

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build-and-push-image:
    needs: [validate]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILD_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Cloud
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate production target
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$PROD_URL" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL et PROD_URL sont requis pour déployer et vérifier la révision."
            exit 1
          fi

      - name: Trigger Webhook / Cloud Run Deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          IMAGE_DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > deploy-payload.json
          import json, os
          image = f"{os.environ['REGISTRY']}/{os.environ['IMAGE_NAME']}".lower()
          print(json.dumps({"image": f"{image}@{os.environ['IMAGE_DIGEST']}", "revision": os.environ['EXPECTED_SHA']}))
          PY
          curl -sS --fail-with-body --max-time 30 -X POST -H 'Content-Type: application/json' --data-binary @deploy-payload.json "${DEPLOY_WEBHOOK_URL}"
          echo "Déploiement déclenché pour la révision ${EXPECTED_SHA}." >> "$GITHUB_STEP_SUMMARY"

      - name: Production Health Check
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Vérification de l'état de santé en production sur ${PROD_URL}/api/ready..."
          for i in {1..12}; do
            STATUS=$(curl -s --max-time 10 -o ready.json -w "%{http_code}" "${PROD_URL}/api/ready" || true)
            if [ "$STATUS" = "200" ] && python -c 'import json, os, sys; d=json.load(open("ready.json")); sys.exit(0 if d.get("status")=="ok" and d.get("revision")==os.environ["EXPECTED_SHA"] else 1)'; then
              echo "✅ Le service de production répond avec succès (HTTP 200) !"
              exit 0
            fi
            echo "Tentative $i/12 : statut HTTP $STATUS. Attente 10s..."
            sleep 10
          done
          echo "⚠️ Le health check n'a pas répondu à temps."
          exit 1


