name: CD — Déploiement ProsArtisan

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Cloud
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Trigger Webhook / Cloud Run Deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Déclenchement du webhook de déploiement sécurisé..."
            # --fail : un webhook qui répond 4xx/5xx fait échouer le job au lieu
            # de laisser croire à un déploiement réussi.
            curl -sS --fail-with-body -X POST "${DEPLOY_WEBHOOK_URL}"
            echo "✅ Déploiement déclenché." >> "$GITHUB_STEP_SUMMARY"
          else
            # Annotation visible sur la page du run : l'image est publiée mais
            # rien n'est déployé (job vert malgré tout, faute de cible).
            echo "::warning title=Aucun déploiement::DEPLOY_WEBHOOK_URL non configuré : image publiée sur GHCR mais aucune cible de déploiement déclenchée."
            echo "⚠️ **Aucun déploiement** : secret \`DEPLOY_WEBHOOK_URL\` absent, seule l'image Docker a été publiée." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Production Health Check
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::warning title=Vérification de santé ignorée::PROD_URL non configuré : l'état de la production n'a pas été vérifié."
            echo "⚠️ **Vérification de santé ignorée** : secret \`PROD_URL\` absent." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Vérification de l'état de santé en production sur ${PROD_URL}/api/health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Le service de production répond avec succès (HTTP 200) !"
              exit 0
            fi
            echo "Tentative $i/12 : statut HTTP $STATUS. Attente 10s..."
            sleep 10
          done
          echo "⚠️ Le health check n'a pas répondu à temps."
          exit 1


